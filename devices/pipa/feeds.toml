# SPDX-License-Identifier: BSD-2-Clause-Patent

# Shared SM8250 / SM8250-AC (kona) support: CPU topology, GICv3, timer, controller register blocks. Its XNU series is for
# the arm64 layer; the arm64e port this board needs is in patches/xnu-12377/soc.
[[source]]
name = "sm8250"
kind = "soc"
git = "https://github.com/FFT-infra/UniXNU-sm8250-common"
commit = "a67a9bf33e44b29c275d13225633ec3475c38461"

