# Kernel step of devices/pipa (macOS Tahoe 26.5, xnu-12377.121.6 + 122 patches) on a macOS runner, the
# platform UniXNU builds on (after UniXNU's own .github/workflows/macos.yml). It compiles and links the native
# XNU kernel; the prelink with the official 26.5 kernelcache (read by HTTP range requests) is optional.
# Only text logs and a JSON report (sizes, hashes, Mach-O header, ISA census) are uploaded: the kernel and every
# Apple input stay on the runner and are removed at the end. Nothing here touches a device.
#
# Runs on workflow_dispatch, and on a push to board-migration-wip whose head commit message contains
# "[kernel-build]", "[kernel-prelink]" to also prelink, or "[kernel-repro]" to also build the same source a second
# time from scratch in the same place and compare the two kernels section by section (a dispatch needs the workflow
# on the default branch, which main does not have yet). Every build also runs scripts/kernel_size_audit.py on the
# link map (-Wl,-map in pipa_macos26_defconfig). The kernel step builds the board's arm64e source storage archive
# (component:ShengUfs) and scripts/pipa_storage_build.py checks it; "[kernel-ufs]" configures pipa_macos26_ufs_defconfig,
# which links it into the kernel ("[storage-build]" only starts a build).
# SPDX-License-Identifier: BSD-2-Clause-Patent
name: Kernel build (pipa, macOS 26.5)

on:
  push:
    branches: [board-migration-wip]
  workflow_dispatch:
    inputs:
      prelink:
        description: "Also prelink with the official macOS 26.5 kernelcache (J274AP 25F71, HTTP range reads)"
        type: boolean
        default: false
      xcode:
        description: "Xcode of the macos-26 image (/Applications/Xcode_<version>.app)"
        default: "26.6"

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  WORK: ${{ github.workspace }}/../pipa-work
  UNIXNU: ${{ github.workspace }}/../UniXNU-build

defaults:
  run:
    shell: bash

jobs:
  kernel:
    if: >-
      github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[kernel-build]') ||
      contains(github.event.head_commit.message, '[kernel-prelink]') || contains(github.event.head_commit.message, '[kernel-repro]') ||
      contains(github.event.head_commit.message, '[storage-build]') || contains(github.event.head_commit.message, '[kernel-ufs]')
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: scripts/pipa_unixnu.py pins the kernel's build date to the last commit that changed a kernel
          # input. In a depth-1 clone that commit looks like it changed every path, so the date would be HEAD's.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Select Xcode
        env:
          XCODE: ${{ inputs.xcode || '26.6' }}
        run: |
          dir="/Applications/Xcode_${XCODE}.app/Contents/Developer"
          if [ -d "$dir" ]; then
            echo "DEVELOPER_DIR=$dir" >> "$GITHUB_ENV"
          else
            echo "::warning::Xcode $XCODE not on this image ($(printf '%s ' /Applications/Xcode_*.app)); using $(xcode-select -p)"
          fi

      - name: Host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Report the toolchain
        run: |
          sw_vers; uname -m; sysctl -n hw.ncpu hw.memsize
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find mig
          clang --version | head -n 1
          python3 --version
          missing=0
          for tool in git make clang cmake ninja unifdef dtc xcodebuild; do
            path=$(command -v "$tool" || true); printf '%-10s %s\n' "$tool" "${path:-MISSING}"; [ -n "$path" ] || missing=1
          done
          df -h "$GITHUB_WORKSPACE"
          exit "$missing"

      - name: UniXNU at the pinned revision, as a checkout of its own
        run: |
          pin=$(git ls-tree HEAD third_party/UniXNU | awk '{print $3}')
          echo "UniXNU $pin"
          git init -q "$UNIXNU"
          git -C "$UNIXNU" remote add origin https://github.com/UniXNU/UniXNU
          git -C "$UNIXNU" fetch -q --depth 1 origin "$pin"
          git -C "$UNIXNU" -c advice.detachedHead=false checkout -q FETCH_HEAD
          git -C "$UNIXNU" submodule update --init --depth 1

      - name: Board check (as in CI)
        run: python3 scripts/pipa_unixnu.py check --unixnu "$UNIXNU" --in-place --work "$WORK" --adt --json "$WORK/pipa-board.json"

      - name: Fetch sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/pipa_unixnu.py run --work "$WORK" -- fetch

      - name: Configure
        # "[kernel-ufs]": pipa_macos26_ufs_defconfig, the same kernel with pipa's source storage linked (G2).
        run: |
          defconfig=pipa_macos26_defconfig
          if [ "$UFS" = 1 ]; then defconfig=pipa_macos26_ufs_defconfig; fi
          echo "defconfig $defconfig"
          python3 scripts/pipa_unixnu.py run --work "$WORK" -- defconfig "$defconfig"
        env:
          UFS: ${{ contains(github.event.head_commit.message, '[kernel-ufs]') && '1' || '0' }}

      - name: Compile and link the native kernel (no prelink)
        id: kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/pipa_unixnu.py run --work "$WORK" -- build kernel --skip-prelink -j "$(sysctl -n hw.ncpu)"

      - name: Report on the kernel (nothing is uploaded but this text)
        id: report
        if: always() && steps.kernel.outcome != 'skipped'
        run: python3 scripts/kernel_report.py --work "$UNIXNU/out" --json "$WORK/kernel-report.json"

      - name: Size audit (sections, origins from the link map, strings by patch)
        id: size
        if: always() && steps.report.outcome == 'success'
        run: |
          python3 scripts/pipa_unixnu.py run --work "$WORK" -- status --json --os macos-26.5-25F71 > "$WORK/status.out"
          python3 - <<'EOF'
          import json, os
          t = open(os.path.join(os.environ["WORK"], "status.out")).read()
          order = json.loads(t[t.index("{"):])["patch_order"]
          open(os.path.join(os.environ["WORK"], "patches.txt"), "w").write("\n".join(order) + "\n")
          print(len(order), "patches")
          EOF
          native=$(find "$UNIXNU/out" -name 'mach.development.bcm2837.unstripped.noctf' -type f | head -n 1)
          tree=${native%%/build/xnu/*}
          map="$tree/build/kernel-link.map"
          xnu=$(find "$UNIXNU/out/feeds" -maxdepth 1 -type d -name 'xnu-*' | head -n 1)
          echo "kernel $native"; echo "map $map ($(wc -c < "$map") bytes)"; echo "xnu source $xnu"
          python3 scripts/kernel_size_audit.py --kernel "$native" --map "$map" --patches "$WORK/patches.txt" \
            --xnu-source "$xnu" --strip-prefix "$tree/.cache/xnu-work/" --strip-prefix "$tree/" --strip-prefix "$UNIXNU/" \
            --json "$WORK/size-audit.json" --markdown "$WORK/size-audit.md" > /dev/null
          cat "$WORK/size-audit.md"

      # G2: pipa's arm64e source storage (PipaUfs + patches/shengufs, the package's five storage sources, no root, read
      # only). The kernel step builds it (component:ShengUfs); this checks the archive (symbols, SM8250 switch, empty
      # policy bundle, what the kernel must provide) and the link map: linked with [kernel-ufs], not linked otherwise.
      - name: Source storage archive (component:ShengUfs; patches/unixnu 0001 + 0003, patches/shengufs)
        id: storage
        if: always() && steps.kernel.outcome != 'skipped'
        run: |
          if [ "${{ steps.kernel.outcome }}" != success ]; then
            python3 scripts/pipa_storage_build.py --unixnu "$UNIXNU" --errors
            exit 1
          fi
          python3 scripts/pipa_storage_build.py --unixnu "$UNIXNU" --check-only --linked "$LINKED" --json "$WORK/storage-build.json"
        env:
          LINKED: ${{ contains(github.event.head_commit.message, '[kernel-ufs]') && 'yes' || 'no' }}

      - name: Prelink with the official macOS 26.5 kernelcache
        id: prelink
        if: >-
          steps.kernel.outcome == 'success' &&
          (inputs.prelink || contains(github.event.head_commit.message, '[kernel-prelink]'))
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/pipa_unixnu.py run --work "$WORK" -- build prelink

      - name: Prelink layout (where the native __TEXT could go, and the margin; numbers only)
        if: always() && (steps.prelink.outcome == 'failure' || steps.prelink.outcome == 'success')
        run: |
          kc=$(find "$UNIXNU/out/ipsw" -name 'kernelcache.decompressed' -type f | head -n 1)
          native=$(find "$UNIXNU/out" -name 'mach.development.bcm2837.unstripped.noctf' -type f | head -n 1)
          python3 scripts/prelink_layout.py --xnuprelink "$UNIXNU/kits/XnuPrelink" --kernelcache "$kc" --kernel "$native" \
            --profile "$UNIXNU/profiles/os/macos-26.5-25F71/profile.toml" --json "$WORK/prelink-layout.json"

      - name: Report on the prelinked kernel collection
        id: prelink_report
        if: always() && steps.prelink.outcome == 'success'
        run: |
          kc=$(find "$UNIXNU/out" -path '*/kernel/kernel.macho' -type f | head -n 1)
          echo "kernel collection: $kc"
          python3 scripts/kernel_report.py --file "$kc" --json "$WORK/prelink-report.json"
          ls -l "$(dirname "$kc")"
          # XnuPrelink's record of the join (inputs, closure, missing and stubbed targets, checks): every key, with long
          # lists and tables shortened to their size. The symbol pairing (kernel.map.json) is summarized by count.
          cp "$(dirname "$kc")/kernel.json" "$WORK/prelink-record.json"
          python3 scripts/prelink_record.py "$(dirname "$kc")/kernel.json" "$(dirname "$kc")/kernel.map.json" \
            --json "$WORK/prelink-record-summary.json"

      - name: Reproducibility (same source, same place, second build from scratch)
        id: repro
        if: always() && steps.report.outcome == 'success' && contains(github.event.head_commit.message, '[kernel-repro]')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mv "$UNIXNU/out/pipa" "$UNIXNU/out/pipa.first"
          python3 scripts/pipa_unixnu.py run --work "$WORK" -- defconfig pipa_macos26_defconfig
          python3 scripts/pipa_unixnu.py run --work "$WORK" -- build kernel --skip-prelink -j "$(sysctl -n hw.ncpu)"
          python3 scripts/kernel_report.py --work "$UNIXNU/out/pipa" --json "$WORK/kernel-report-2.json" > /dev/null
          python3 scripts/kernel_report.py --compare "$WORK/kernel-report.json" "$WORK/kernel-report-2.json" --json "$WORK/repro.json"

      - name: Collect the text logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/public"
          cp "$WORK"/pipa-board.json "$WORK"/kernel-report.json "$WORK"/prelink-report.json "$WORK"/prelink-layout.json \
            "$WORK"/size-audit.json "$WORK"/size-audit.md "$WORK"/kernel-report-2.json "$WORK"/repro.json \
            "$WORK"/prelink-record.json "$WORK"/prelink-record-summary.json "$WORK"/storage-build.json \
            "$RUNNER_TEMP/public/" 2>/dev/null || true
          python3 - <<'EOF'
          import os
          from pathlib import Path
          out = Path(os.environ["UNIXNU"]) / "out"
          target = Path(os.environ["RUNNER_TEMP"]) / "public" / "logs"
          target.mkdir(parents=True, exist_ok=True)
          n = 0
          for path in sorted(out.rglob("*.log")) if out.is_dir() else []:
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              name = "__".join(path.relative_to(out).parts)
              (target / name).write_bytes(data)
              n += 1
          print(f"{n} text logs staged")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipa-kernel-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        env:
          KERNEL: ${{ steps.kernel.outcome }}
          REPORT: ${{ steps.report.outcome }}
          PRELINK: ${{ steps.prelink.outcome }}
          PRELINK_REPORT: ${{ steps.prelink_report.outcome }}
          REPRO: ${{ steps.repro.outcome }}
        run: |
          {
            echo "## pipa kernel step (macOS 26.5, xnu-12377.121.6)"
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| compile + link native kernel | ${KERNEL:-skipped} |"
            echo "| linked kernel found and inspected | ${REPORT:-skipped} |"
            echo "| prelink with the 26.5 kernelcache | ${PRELINK:-skipped} |"
            echo "| kernel collection inspected | ${PRELINK_REPORT:-skipped} |"
            echo "| second build compared | ${REPRO:-skipped} |"
            echo
            if [ -f "$WORK/size-audit.md" ]; then echo; cat "$WORK/size-audit.md"; fi
            if [ -f "$WORK/repro.json" ]; then echo; echo '```json'; head -c 4000 "$WORK/repro.json"; echo; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove Apple inputs and build outputs
        if: always()
        run: rm -rf "$UNIXNU/out" "$UNIXNU/.cache"
